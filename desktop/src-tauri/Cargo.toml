[package]
name = "lekuvo-desktop"
version = "0.1.0"
description = "Lekuvo notch bar desktop shell"
edition = "2021"

[lib]
name = "lekuvo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MPRIS media monitoring/control, shared with the velqu-view line.
lekuvo-media = { path = "../../crates/lekuvo-media" }
