<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lekuvo</title>
</head>
<body style="margin:0">
  <main
    id="root"
    vx-state="{
      expanded: false,
      tucked: false,
      clock: '--:--',
      hasMedia: false,
      media: { playing: false, title: 'Nothing playing', artist: '' },
      zone: 'tc',
      tab: 'music',
      live: 'idle',
      theme: 'classic',
      focus: { clock: '25:00', pct: 0, running: false, mode: 'focus', sessions: 0 },
      toast: { visible: false, title: '', sub: '' },
      todos: [
        { done: false, text: 'Drink water' },
        { done: false, text: 'Reply to Sarah' },
        { done: true, text: 'Ship the notch' }
      ]
    }"
    style="width:560px;height:372px"
    :class="zone === 'bl' || zone === 'bc' || zone === 'br'
      ? 'flex flex-col-reverse justify-end items-center'
      : 'flex flex-col justify-start items-center'"
  >
    <!-- The pill: mascot, live activity, clock, grip. -->
    <div
      id="pill"
      data-vv-test="pill"
      class="lk-surface lk-pill flex items-center gap-2.5 h-10 pl-2.5 pr-4 text-slate-100 transition duration-500"
      :class="tucked
        ? 'lk-surface lk-pill flex items-center gap-2.5 h-10 pl-2.5 pr-4 text-slate-100 transition duration-500 opacity-0'
        : 'lk-surface lk-pill flex items-center gap-2.5 h-10 pl-2.5 pr-4 text-slate-100 transition duration-500 opacity-100'"
      @click="expanded = !expanded"
    >
      <div id="mascot-compact" data-vv-test="mascot-compact" class="w-8 h-8 shrink-0"></div>
      <span id="divider" data-vv-test="divider" class="lk-line w-px h-5 shrink-0"></span>

      <!-- Live activity label + focus progress -->
      <div id="live-col" data-vv-test="live-col" class="flex flex-col justify-center min-w-0" style="width:150px">
        <div class="flex items-center gap-2 min-w-0">
          <span
            id="live-label"
            class="lk-nowrap lk-display lk-tabular text-sm font-semibold text-slate-200"
            vx-text="live === 'music' && hasMedia
              ? media.title
              : live === 'focus'
                ? (focus.mode === 'focus' ? 'Focus' : 'Break') + ' \u00b7 ' + focus.clock
                : 'Lekuvo is napping\u2026'"
          ></span>
          <!-- playing indicator: three bars -->
          <span vx-show="live === 'music' && media.playing" class="shrink-0" style="display:flex;align-items:flex-end;gap:2px;height:12px">
            <span class="lk-eqbar animate-pulse" style="width:3px;height:12px;border-radius:999px;background-color:#8EA7F7"></span>
            <span class="lk-eqbar animate-pulse" style="width:3px;height:9px;border-radius:999px;background-color:#8EA7F7"></span>
            <span class="lk-eqbar animate-pulse" style="width:3px;height:7px;border-radius:999px;background-color:#8EA7F7"></span>
          </span>
        </div>
        <div id="focus-progress" class="lk-line h-1 rounded-full mt-1 overflow-hidden" vx-show="live === 'focus'">
          <div class="lk-warm h-full rounded-full" :style="'width:' + focus.pct + '%'"></div>
        </div>
      </div>

      <span id="clock" data-vv-test="clock" vx-text="clock" class="lk-display lk-tabular text-base font-bold ml-auto"></span>
      <img src="icons/grip.png" alt="" class="shrink-0" style="width:14px;height:14px;opacity:0.55" />
    </div>

    <!-- Toast tier -->
    <div
      id="toast"
      data-vv-test="toast"
      class="lk-surface lk-elevated mt-2 rounded-2xl text-slate-100 px-4 py-3 flex items-center gap-3"
      vx-show="toast.visible && !tucked"
    >
      <div id="mascot-toast" class="w-9 h-9 shrink-0"></div>
      <div class="flex flex-col min-w-0">
        <p vx-text="toast.title" class="lk-nowrap font-bold text-sm leading-tight"></p>
        <p vx-text="toast.sub" class="lk-nowrap text-xs text-slate-400"></p>
      </div>
    </div>

    <!-- The expanded card -->
    <div
      id="card"
      data-vv-test="card"
      class="lk-surface lk-elevated mt-2 rounded-2xl text-slate-100 p-5 flex flex-col gap-4"
      style="width:480px"
      vx-show="expanded && !tucked"
    >
      <!-- Tab bar -->
      <div id="tabbar" data-vv-test="tabbar" class="lk-inset flex items-center gap-1 rounded-full p-1">
        <button
          id="tab-music"
          class="flex-1 rounded-full px-3 py-2 text-xs font-bold transition"
          :class="tab === 'music'
            ? 'lk-accent flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-white'
            : 'flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-slate-400'"
          @click="tab = 'music'"
        >Music</button>
        <button
          id="tab-focus"
          class="flex-1 rounded-full px-3 py-2 text-xs font-bold transition"
          :class="tab === 'focus'
            ? 'lk-warm flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-slate-900'
            : 'flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-slate-400'"
          @click="tab = 'focus'"
        >Focus</button>
        <button
          id="tab-todo"
          class="flex-1 rounded-full px-3 py-2 text-xs font-bold transition"
          :class="tab === 'todo'
            ? 'lk-cool flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-slate-900'
            : 'flex-1 rounded-full px-3 py-2 text-xs font-bold transition text-slate-400'"
          @click="tab = 'todo'"
        >To-do</button>
      </div>

      <!-- Music panel -->
      <div id="musicrow" data-vv-test="musicrow" vx-show="tab === 'music'" class="flex items-center gap-4">
        <!-- Vinyl record (themed accent disc) -->
        <div
          class="lk-vinyl shrink-0"
          :class="media.playing
            ? 'lk-vinyl animate-spin shrink-0'
            : 'lk-vinyl shrink-0'"
          style="width:96px;height:96px;border-radius:999px;display:flex;flex-direction:column;align-items:center;padding-top:12px"
        >
          <!-- off-center marker: the visible proof the disc is spinning -->
          <div style="width:7px;height:7px;border-radius:999px;background-color:#F2F4FFB3"></div>
          <div class="lk-vinyl-ring" style="width:58px;height:58px;border-radius:999px;border:6px solid #FFFFFF2E;display:flex;align-items:center;justify-content:center;margin-top:8px">
            <div class="lk-vinyl-center" style="width:30px;height:30px;border-radius:999px;background-color:#10131F;display:flex;align-items:center;justify-content:center">
              <div class="lk-vinyl-hole" style="width:10px;height:10px;border-radius:999px;background-color:#F2F4FFEB"></div>
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-1.5 grow min-w-0">
          <p vx-text="media.title" class="lk-display lk-nowrap font-bold text-lg leading-tight"></p>
          <p vx-text="media.artist" class="lk-nowrap text-sm text-slate-400"></p>
          <div class="flex items-center gap-2 mt-0.5">
            <span vx-show="media.playing" class="shrink-0" style="display:flex;align-items:flex-end;gap:2px;height:12px">
              <span class="lk-eqbar animate-pulse" style="width:3px;height:12px;border-radius:999px;background-color:#8EA7F7"></span>
              <span class="lk-eqbar animate-pulse" style="width:3px;height:9px;border-radius:999px;background-color:#8EA7F7"></span>
              <span class="lk-eqbar animate-pulse" style="width:3px;height:7px;border-radius:999px;background-color:#8EA7F7"></span>
            </span>
            <span
              class="lk-nowrap text-xs font-bold" style="background-color:#FFFFFF1A;color:#C7CFE8;border-radius:999px;padding:2px 8px"
              vx-text="hasMedia ? (media.playing ? 'Playing now' : 'Paused') : 'No player'"
            ></span>
          </div>
        </div>
      </div>
      <div id="transport" data-vv-test="transport" vx-show="tab === 'music'" class="flex items-center justify-center gap-6">
        <button id="btn-prev" class="lk-btn w-10 h-10 rounded-full flex items-center justify-center">
          <img src="icons/prev.png" alt="Previous" style="width:16px;height:16px" />
        </button>
        <button id="btn-play" class="lk-btn-accent w-14 h-14 rounded-full flex items-center justify-center">
          <img vx-show="!media.playing" src="icons/play.png" alt="Play" style="width:20px;height:20px" />
          <img vx-show="media.playing" src="icons/pause.png" alt="Pause" style="width:20px;height:20px" />
        </button>
        <button id="btn-next" class="lk-btn w-10 h-10 rounded-full flex items-center justify-center">
          <img src="icons/next.png" alt="Next" style="width:16px;height:16px" />
        </button>
      </div>

      <!-- Focus panel -->
      <div id="focuspanel" data-vv-test="focuspanel" vx-show="tab === 'focus'" class="flex flex-col items-center gap-3">
        <p class="lk-caps text-xs font-bold text-slate-500">
          <span vx-text="focus.mode === 'focus' ? 'Focus session' : 'Break time'"></span>
        </p>
        <p vx-text="focus.clock" class="lk-display lk-tabular text-5xl font-bold"></p>
        <div class="lk-line w-full h-2 rounded-full overflow-hidden">
          <div class="lk-warm h-full rounded-full" :style="'width:' + focus.pct + '%'"></div>
        </div>
        <div class="flex items-center gap-3">
          <button
            id="btn-focus-toggle"
            class="lk-warm rounded-full px-6 py-2 text-sm font-bold text-slate-900"
            vx-text="focus.running ? 'Pause' : 'Start'"
          ></button>
          <button id="btn-focus-reset" class="lk-btn rounded-full px-6 py-2 text-sm font-bold text-slate-200">Reset</button>
        </div>
        <p class="text-xs text-slate-500">
          Sessions today: <span vx-text="focus.sessions" class="font-bold text-slate-300"></span>
        </p>
      </div>

      <!-- To-do panel -->
      <div id="todopanel" data-vv-test="todopanel" vx-show="tab === 'todo'" class="flex flex-col gap-2">
        <button
          id="todo-0"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-left transition"
          :class="todos[0].done
            ? 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition opacity-50'
            : 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition'"
        >
          <span
            class="lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs"
            :class="todos[0].done
            ? 'lk-border lk-cool w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs text-slate-900'
            : 'lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs'"
          ><span vx-show="todos[0].done">&#10003;</span></span>
          <span
            vx-text="todos[0].text"
            class="text-sm font-semibold"
            :class="todos[0].done
            ? 'lk-nowrap text-sm font-semibold line-through'
            : 'lk-nowrap text-sm font-semibold'"
          ></span>
        </button>
        <button
          id="todo-1"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-left transition"
          :class="todos[1].done
            ? 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition opacity-50'
            : 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition'"
        >
          <span
            class="lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs"
            :class="todos[1].done
            ? 'lk-border lk-cool w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs text-slate-900'
            : 'lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs'"
          ><span vx-show="todos[1].done">&#10003;</span></span>
          <span
            vx-text="todos[1].text"
            class="text-sm font-semibold"
            :class="todos[1].done
            ? 'lk-nowrap text-sm font-semibold line-through'
            : 'lk-nowrap text-sm font-semibold'"
          ></span>
        </button>
        <button
          id="todo-2"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-left transition"
          :class="todos[2].done
            ? 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition opacity-50'
            : 'lk-inset flex items-center gap-3 rounded-xl px-4 py-3 text-left transition'"
        >
          <span
            class="lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs"
            :class="todos[2].done
            ? 'lk-border lk-cool w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs text-slate-900'
            : 'lk-border w-5 h-5 rounded-md border-2 flex items-center justify-center text-xs'"
          ><span vx-show="todos[2].done">&#10003;</span></span>
          <span
            vx-text="todos[2].text"
            class="text-sm font-semibold"
            :class="todos[2].done
            ? 'lk-nowrap text-sm font-semibold line-through'
            : 'lk-nowrap text-sm font-semibold'"
          ></span>
        </button>
      </div>

      <div id="footrow" data-vv-test="footrow" class="flex items-center justify-between text-xs text-slate-500">
        <!-- Theme picker -->
        <div class="flex items-center gap-2">
          <button
            id="theme-classic"
            title="Classic"
            class="sw-classic lk-unsel w-5 h-5 rounded-full border-2"
            :class="theme === 'classic'
              ? 'sw-classic lk-sel w-5 h-5 rounded-full border-2'
              : 'sw-classic lk-unsel w-5 h-5 rounded-full border-2'"
          ></button>
          <button
            id="theme-meadow"
            title="Meadow"
            class="sw-meadow lk-unsel w-5 h-5 rounded-full border-2"
            :class="theme === 'meadow'
              ? 'sw-meadow lk-sel w-5 h-5 rounded-full border-2'
              : 'sw-meadow lk-unsel w-5 h-5 rounded-full border-2'"
          ></button>
          <button
            id="theme-sunset"
            title="Sunset"
            class="sw-sunset lk-unsel w-5 h-5 rounded-full border-2"
            :class="theme === 'sunset'
              ? 'sw-sunset lk-sel w-5 h-5 rounded-full border-2'
              : 'sw-sunset lk-unsel w-5 h-5 rounded-full border-2'"
          ></button>
          <button
            id="theme-dusk"
            title="Dusk"
            class="sw-dusk lk-unsel w-5 h-5 rounded-full border-2"
            :class="theme === 'dusk'
              ? 'sw-dusk lk-sel w-5 h-5 rounded-full border-2'
              : 'sw-dusk lk-unsel w-5 h-5 rounded-full border-2'"
          ></button>
        </div>
        <span class="font-bold">Lekuvo</span>
        <button id="btn-close" class="lk-btn rounded-full w-7 h-7 flex items-center justify-center">
          <img src="icons/close.png" alt="Close" style="width:12px;height:12px" />
        </button>
      </div>
    </div>
  </main>
</body>
</html>
