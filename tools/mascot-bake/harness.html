<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>bake</title>
  <style>
    @font-face {
      font-family: "Outfit";
      src: url("/app/fonts/Nunito-800.ttf") format("truetype");
      font-weight: 800;
    }
    html, body { margin: 0; padding: 0; background: transparent; }
    #grid { display: flex; flex-direction: column; }
    .row { display: flex; }
    .cell { width: var(--slot); height: var(--slot); overflow: hidden; }
    .cell svg { display: block; }
  </style>
</head>
<body>
  <!--
    Bakes every mood x frame of the reference Lekuvo mascot (ported
    from the develop repo's Lekuvo.tsx into ref-mascot.js) into one
    grid so a single headless screenshot captures a whole variant.
    URL params: variant=full|compact  slot=px  frames=N
    Row order = APP_MOODS order; each row freezes the mood's CSS
    animation cycle at i/frames fractions. Frames are square with the
    240x190 artwork letterboxed (see ref-mascot.js).
  -->
  <div id="grid"></div>
  <script type="module">
    import { APP_MOODS, APP_MOOD_CYCLES, MASCOT_CSS, renderAppMood } from "/tools/mascot-bake/ref-mascot.js";

    const style = document.createElement("style");
    style.textContent = MASCOT_CSS;
    document.head.appendChild(style);

    const params = new URLSearchParams(location.search);
    const variant = params.get("variant") || "full";
    const slot = Number(params.get("slot") || 288);
    const frames = Number(params.get("frames") || 8);

    document.documentElement.style.setProperty("--slot", slot + "px");

    const grid = document.getElementById("grid");
    const elements = [];
    for (const mood of Object.keys(APP_MOODS)) {
      const row = document.createElement("div");
      row.className = "row";
      for (let index = 0; index < frames; index += 1) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const holder = document.createElement("div");
        holder.innerHTML = renderAppMood(mood, {
          size: slot,
          idPrefix: `${variant}-${mood}-${index}`,
        });
        cell.appendChild(holder.firstElementChild);
        row.appendChild(cell);
        elements.push({ svg: cell, mood, index });
      }
      grid.appendChild(row);
    }

    // Two animation frames so elements are connected and rendered.
    await new Promise((resolve) =>
      requestAnimationFrame(() => requestAnimationFrame(resolve)),
    );

    for (const { svg, mood, index } of elements) {
      const cycle = APP_MOOD_CYCLES[mood] || 1800;
      const at = (index / frames) * cycle;
      for (const animation of svg.getAnimations({ subtree: true })) {
        animation.pause();
        const d = animation.effect ? animation.effect.getTiming().duration : 0;
        if (d > 0) {
          animation.currentTime = at % d;
        } else {
          animation.currentTime = at;
        }
      }
    }

    document.title = "READY";
  </script>
</body>
</html>
