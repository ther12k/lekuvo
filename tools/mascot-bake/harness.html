<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>bake</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    #grid { display: flex; flex-direction: column; }
    .row { display: flex; }
    .cell { width: var(--slot); height: var(--slot); overflow: hidden; }
    lekuvo-mascot { display: block; }
  </style>
</head>
<body>
  <!--
    Bakes every mood x frame of the Lekuvo mascot into one grid so a
    single headless screenshot captures a whole variant. URL params:
      variant=full|compact   slot=px   frames=N
    Row order = the kit's MOODS order; each row freezes the mood's CSS
    animation cycle at i/frames fractions.
  -->
  <div id="grid"></div>
  <script type="module">
    import { MOODS } from "/vendor/lekuvo-svg-kit/src/lekuvo-mascot.js";

    const params = new URLSearchParams(location.search);
    const variant = params.get("variant") || "full";
    const slot = Number(params.get("slot") || 96);
    const frames = Number(params.get("frames") || 8);

    document.documentElement.style.setProperty("--slot", slot + "px");
    await customElements.whenDefined("lekuvo-mascot");

    const grid = document.getElementById("grid");
    const elements = [];
    for (const mood of MOODS) {
      const row = document.createElement("div");
      row.className = "row";
      for (let index = 0; index < frames; index += 1) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const mascot = document.createElement("lekuvo-mascot");
        mascot.setAttribute("size", String(slot));
        mascot.setAttribute("variant", variant);
        mascot.setAttribute("motion", "on");
        cell.appendChild(mascot);
        row.appendChild(cell);
        elements.push({ mascot, mood, index });
      }
      grid.appendChild(row);
    }

    // Two animation frames so elements are connected and rendered.
    await new Promise((resolve) =>
      requestAnimationFrame(() => requestAnimationFrame(resolve)),
    );

    for (const { mascot, mood } of elements) {
      mascot.setMood(mood);
      mascot.removeAttribute("data-paused");
      if (typeof mascot.resume === "function") mascot.resume();
    }

    await new Promise((resolve) =>
      requestAnimationFrame(() => requestAnimationFrame(resolve)),
    );

    // Primary cycle per mood in milliseconds (from authored CSS keyframes).
    const DEFAULT_CYCLES = {
      dance: 900,
      wave: 1650,
      listening: 1800,
      thinking: 1800,
      alert: 2200,
      dizzy: 2300,
      sleep: 5000,
      awake: 5400,
      success: 1650,
      surprised: 480,
      focus: 10000,
      lazy: 9000,
    };

    for (const { mascot, mood, index } of elements) {
      const root = mascot.shadowRoot || mascot;
      const animations = root.getAnimations({ subtree: true });
      if (animations.length === 0) continue;

      let cycle = DEFAULT_CYCLES[mood] || 1800;
      // Seek each animation to its phase in the mood's cycle
      const at = (index / frames) * cycle;
      for (const animation of animations) {
        animation.pause();
        const d = animation.effect ? animation.effect.getTiming().duration : 0;
        if (d > 0) {
          animation.currentTime = at % d;
        } else {
          animation.currentTime = at;
        }
      }
    }

    document.title = "READY";
  </script>
</body>
</html>
